<!DOCTYPE html>
<html>
<head>
  <title>Business Text Simplifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      width: 420px;
      margin: 0;
      padding: 0;
    }
    
    .container {
      padding: 20px;
    }
    
    header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 15px;
    }
    
    .logo {
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }
    
    h1 {
      font-size: 20px;
      color: #2a5885;
      margin: 0;
    }
    
    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .primary-btn {
      background-color: #3a7bd5;
      color: white;
    }
    
    .primary-btn:hover {
      background-color: #2a5885;
    }
    
    .secondary-btn {
      background-color: #f0f4f7;
      color: #2a5885;
      border: 1px solid #d0d7de;
    }
    
    .secondary-btn:hover {
      background-color: #e1e4e8;
    }
    
    .icon {
      margin-right: 8px;
      font-size: 16px;
    }
    
    .result-section {
      background-color: #f7fafc;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 15px;
      max-height: 250px;
      overflow-y: auto;
      margin: 15px 0;
    }
    
    .result-section h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #2a5885;
    }
    
    #result {
      font-size: 14px;
      line-height: 1.6;
    }
    
    .placeholder {
      color: #6c757d;
      font-style: italic;
    }
    
    .error {
      color: #e53935;
      padding: 10px;
      background-color: #ffebee;
      border-radius: 4px;
    }
    
    footer {
      font-size: 12px;
      color: #6c757d;
      text-align: center;
      margin-top: 15px;
    }
    
    .spinner {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 3px solid #3a7bd5;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    
    .loading #result {
      display: none;
    }
    
    .loading .spinner {
      display: block;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="images/icon.png" alt="Logo" class="logo">
      <h1>Business Text Simplifier</h1>
    </header>
    
    <button id="simplify-selection" class="primary-btn">
      <span class="icon">✂️</span>
      Simplify Selected Text
    </button>
    
    <button id="simplify-page" class="secondary-btn">
      <span class="icon">📄</span>
      Simplify Current Page
    </button>
    
    <div class="result-section">
      <h2>Simplified Text:</h2>
      <div class="spinner"></div>
      <div id="result">
        <p class="placeholder">Select text on any page and click "Simplify Selected Text"</p>
      </div>
    </div>
    
    <footer>
      Powered by AI Text Summarization
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
